<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Costlens</title>
  <link rel="stylesheet" href="/vendor/uplot.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Costlens</h1>
    <span class="status" id="conn-status" title="Connection status">…</span>
    <button id="refresh" type="button">↻ Refresh</button>
  </header>

  <main>
    <section id="summary" class="card">
      <div class="stat">
        <div class="label">Total spent</div>
        <div class="value" id="stat-cost">$0.00</div>
      </div>
      <div class="stat">
        <div class="label">Total turns</div>
        <div class="value" id="stat-turns">0</div>
      </div>
      <div class="stat">
        <div class="label">Features</div>
        <div class="value" id="stat-features">0</div>
      </div>
      <div class="stat" id="stat-current-wrap">
        <div class="label">Current</div>
        <div class="value" id="stat-current">—</div>
      </div>
    </section>

    <section class="card">
      <h2>Top 5 features</h2>
      <div class="table-wrap">
        <table id="top-features">
          <thead>
            <tr><th>Feature</th><th>Status</th><th class="num">Turns</th><th class="num">Cost</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Cost by day (last 30)</h2>
      <div id="by-day-chart" class="chart"></div>
      <details class="chart-details">
        <summary>data</summary>
        <div class="table-wrap">
          <table id="by-day">
            <thead><tr><th>Date</th><th class="num">Turns</th><th class="num">Cost</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <section class="card">
      <h2>Cost by model</h2>
      <div id="by-model-chart" class="chart"></div>
      <details class="chart-details">
        <summary>data</summary>
        <div class="table-wrap">
          <table id="by-model">
            <thead><tr><th>Model</th><th class="num">Turns</th><th class="num">In</th><th class="num">Out</th><th class="num">Cost</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <section class="card">
      <h2>Status breakdown</h2>
      <ul id="by-status" class="status-list"></ul>
    </section>
  </main>

  <footer>
    <span>Costlens v0.4.0 · dogfooded on <code id="current-feature">—</code></span>
  </footer>

  <script src="/vendor/uplot.iife.min.js"></script>
  <script src="/overview.js"></script>
</body>
</html>
